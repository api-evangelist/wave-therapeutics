name: Wave Therapeutics
description: >-
  Wave Therapeutics is a healthtech medical-device company founded in 2017 and headquartered in
  Nashville, Indiana, and backed by Techstars (Future of Longevity). It develops active therapeutic
  cushioning that helps prevent pressure injuries (bedsores) and reduce blood-clot risk, led by a
  microprocessor-controlled peristaltic-pump wheelchair cushion paired with monitoring analytics, with
  a planned fleet of products spanning mattress toppers and consumer seating. Wave Therapeutics is a
  hardware and clinical-device business and publishes no public developer API, SDK, or developer
  portal; this profile was surfaced as a Techstars portfolio lead and enriched by the API Evangelist
  pipeline, which confirmed no API surface exists.
